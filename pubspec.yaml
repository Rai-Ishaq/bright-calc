name: bright_calc
description: A clean, colorful Flutter calculator app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter_native_splash:
  color: "#7C5CFC"
  image: "assets/logo.png"
  android_12:
    image: "assets/logo.png"
    color: "#7C5CFC"

flutter:
  uses-material-design: true
  assets:
    - assets/
